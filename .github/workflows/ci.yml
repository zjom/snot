name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build and test, clippy and rustfmt, all defined in flake.nix, with the same
  # toolchain as `nix develop`.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
